[project]
name = "job-processor"
version = "0.1.0"
description = "Accepts a flight plan, predicts its fuel with the airline's model, and saves the result."
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "pydantic-settings",
    "sqlalchemy",
    "httpx",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

# Without a build system, uv installs the dependencies but not this package,
# so the Docker image cannot import job_processor.
[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I"]  # sort imports

[tool.mypy]
strict = true
files = ["src", "tests"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
